services:
  - type: web
    name: denialnet
    env: python
    region: oregon
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn routes:app --host 0.0.0.0 --port $PORT --workers 2
    healthCheckPath: /ready
    envVars:
      - key: DENIALNET_ENV
        value: production
      - key: DENIALNET_ADMIN_API_KEY
        sync: false
      - key: DENIALNET_DATABASE_URL
        sync: false
      - key: DENIALNET_REDIS_URL
        sync: false
      - key: DENIALNET_STRIPE_SECRET_KEY
        sync: false
      - key: DENIALNET_STRIPE_WEBHOOK_SECRET
        sync: false
      - key: DENIALNET_QUERY_COST_CENTS
        value: "75"
      - key: DENIALNET_CONTRIBUTOR_SPLIT
        value: "0.70"
